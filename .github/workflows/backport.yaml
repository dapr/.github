# Reusable workflow for backporting merged PRs to release branches.
# The calling workflow must use a pull_request_target trigger with types:
# [closed, labeled].

name: Backport

on:
  workflow_call:
    secrets:
      dapr_bot_token:
        required: true

permissions: {}

jobs:
  backport:
    name: Backport
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged
      && (
        github.event.action == 'closed'
        || (
          github.event.action == 'labeled'
          && contains(github.event.label.name, 'backport')
        )
      )
    steps:
      - uses: tibdex/backport@9565281eda0731b1d20c4025c43339fb0a23812e
        with:
          github_token: ${{ secrets.dapr_bot_token }}

  delete-branch:
    name: Delete backport branch
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'closed'
      && startsWith(github.event.pull_request.head.ref, 'backport-')
    steps:
      - name: Delete branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.dapr_bot_token }}
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.payload.pull_request.head.ref}`,
            })
