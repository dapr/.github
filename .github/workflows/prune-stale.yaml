# Reusable workflow for pruning stale issues and PRs.
# Issues and PRs with no activity for 90 days are marked stale, and closed
# after a further 7 days unless labelled pinned, good first issue, help wanted,
# or triaged/resolved.

name: Prune stale issues and PRs

on:
  workflow_call:
    secrets:
      dapr_bot_token:
        required: true

permissions: {}

jobs:
  prune_stale:
    name: Prune stale
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Prune stale
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.dapr_bot_token }}
          days-before-pr-stale: 90
          days-before-pr-close: 7
          days-before-issue-stale: 90
          days-before-issue-close: 7
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had activity in the
            last 90 days. It will be closed in the next 7 days unless it is tagged
            (pinned, good first issue, help wanted or triaged/resolved) or other activity
            occurs. Thank you for your contributions.
          close-issue-message: >
            This issue has been automatically closed because it has not had activity in the
            last 97 days. If this issue is still valid, please ping a maintainer and ask them
            to label it as pinned, good first issue, help wanted or triaged/resolved.
            Thank you for your contributions.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            activity in the last 90 days. It will be closed in 7 days if no further activity
            occurs. Please feel free to give a status update now, ping for review, or re-open
            when it's ready. Thank you for your contributions!
          close-pr-message: >
            This pull request has been automatically closed because it has not had
            activity in the last 97 days. Please feel free to give a status update now,
            ping for review, or re-open when it's ready. Thank you for your contributions!
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,good first issue,help wanted,triaged/resolved'
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned'
          operations-per-run: 500
          ascending: true
