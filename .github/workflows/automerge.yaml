# Reusable workflow for automerging and autoupdating PRs.
# PRs labelled "automerge" that have been approved by a maintainer and are in
# a clean state will be squash-merged (one per run).
# PRs labelled "automerge" or "autoupdate" that are behind the base branch
# will have their branch updated.

name: Automerge and autoupdate PRs

on:
  workflow_call:
    inputs:
      maintainer-teams:
        description: 'Comma-separated list of GitHub team slugs whose members can approve automerge'
        required: true
        type: string
    secrets:
      dapr_bot_token:
        required: true

permissions: {}

jobs:
  automerge:
    if: github.repository_owner == 'dapr'
    name: Automerge and update PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout dapr/.github
        uses: actions/checkout@v4
        with:
          repository: dapr/.github
          path: dapr-github
      - name: Install dependencies
        run: pip install PyGithub
      - name: Automerge and autoupdate
        env:
          MAINTAINER_TEAMS: ${{ inputs.maintainer-teams }}
          GITHUB_TOKEN: ${{ secrets.dapr_bot_token }}
        run: python dapr-github/.github/scripts/automerge.py
